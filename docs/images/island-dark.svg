<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The loop of one island, and its exchange with the migrant pool">
  <title>The loop of one island, and its exchange with the migrant pool</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9198a1"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#db6d28"/></marker></defs>
  <rect x="20" y="20" width="600" height="340" rx="12" fill="none" stroke="#656c76" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="34" y="40" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start">One island · one worker</text>
  <rect x="50" y="60" width="170" height="64" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/>
  <rect x="50" y="68" width="3" height="48" rx="1.5" fill="#db61a2"/>
  <text x="135.0" y="90.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Select</text>
  <text x="135.0" y="107.0" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">two parents by fitness</text>
  <rect x="230" y="60" width="170" height="64" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/>
  <rect x="230" y="68" width="3" height="48" rx="1.5" fill="#db61a2"/>
  <text x="315.0" y="90.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Order crossover</text>
  <text x="315.0" y="107.0" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">giant tour of customers</text>
  <rect x="410" y="60" width="170" height="64" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/>
  <rect x="410" y="68" width="3" height="48" rx="1.5" fill="#db61a2"/>
  <text x="495.0" y="90.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Split</text>
  <text x="495.0" y="107.0" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">cut into routes, O(n)</text>
  <rect x="410" y="250" width="170" height="64" rx="8" fill="#0c2d6b" stroke="#3d444d" stroke-width="1.2"/>
  <rect x="410" y="258" width="3" height="48" rx="1.5" fill="#4493f8"/>
  <text x="495.0" y="280.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Local search</text>
  <text x="495.0" y="297.0" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">GPU finds moves, CPU applies</text>
  <rect x="50" y="250" width="170" height="64" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/>
  <rect x="50" y="258" width="3" height="48" rx="1.5" fill="#db61a2"/>
  <text x="135.0" y="280.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Survival</text>
  <text x="135.0" y="297.0" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">keep by cost and diversity</text>
  <path d="M 220 92 L 228 92" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M 400 92 L 408 92" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M 495 124 L 495 248" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M 410 282 L 222 282" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <path d="M 135 250 L 135 126" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <text x="320" y="170" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Population</text>
  <text x="320" y="188" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">feasible and infeasible plans,</text>
  <text x="320" y="203" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">capacity overload paid as a penalty</text>
  <text x="320" y="340" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">Five islands per GPU by default take turns, sharing one read-only DeviceMatrix.</text>
  <rect x="720" y="140" width="240" height="70" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/>
  <rect x="720" y="148" width="3" height="54" rx="1.5" fill="#db6d28"/>
  <text x="840.0" y="166.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Migrant pool</text>
  <text x="840.0" y="183.0" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">in the orchestrator</text>
  <text x="840.0" y="198.0" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">one slot per island</text>
  <path d="M 622 160 L 718 160" fill="none" stroke="#db6d28" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-orange)" stroke-dasharray="5 4"/>
  <text x="670" y="150" font-size="11.5" font-weight="500" fill="#db6d28" text-anchor="middle">best, if improved</text>
  <path d="M 718 196 L 622 196" fill="none" stroke="#db6d28" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-orange)" stroke-dasharray="5 4"/>
  <text x="670" y="214" font-size="11.5" font-weight="500" fill="#db6d28" text-anchor="middle">another island&#x27;s</text>
  <text x="840" y="246" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Every 2 s, without waiting.</text>
  <text x="840" y="264" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">A migrant joins the population;</text>
  <text x="840" y="280" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">it replaces nothing there.</text>
  <rect x="740" y="316" width="26" height="18" rx="4" fill="#161b22" stroke="#3d444d" stroke-width="1.2"/>
  <rect x="740" y="319" width="3" height="12" rx="1.5" fill="#db61a2"/>
  <text x="776" y="329" font-size="12" font-weight="500" fill="#e6edf3" text-anchor="start">Runs on the CPU</text>
  <rect x="740" y="342" width="26" height="18" rx="4" fill="#0c2d6b" stroke="#3d444d" stroke-width="1.2"/>
  <rect x="740" y="345" width="3" height="12" rx="1.5" fill="#4493f8"/>
  <text x="776" y="355" font-size="12" font-weight="500" fill="#e6edf3" text-anchor="start">Mostly on the GPU</text>
</svg>
