[tool.uv.workspace]
members = ["client", "orchestrator", "preprocessor"]

[tool.uv]
required-version = ">=0.13.7"

[dependency-groups]
# Exact versions, so formatting and lint results are the same everywhere.
dev = [
    "hypothesis==6.170.15",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "cryptography==50.0.2",
    "scipy-stubs==1.18.1.1",
    "types-boto3==1.44.9",
    "types-boto3-s3==1.44.6",
    "types-grpcio==1.85.0.20261122",
    "types-protobuf==7.35.1.20261122",
]
# What `deploy/admin.py` needs in the image, to make the lab CA.
deploy = ["cryptography==50.0.2"]

# ---- ruff: formatter and linter ----------------------------------------------

[tool.ruff]
line-length = 80
target-version = "py313"
# Python files only: by default ruff also formats code blocks in Markdown.
include = ["*.py", "*.pyi", "**/pyproject.toml"]
# Generated from proto/vrp/v1/vrp.proto when the orchestrator is built.
extend-exclude = ["**/vrp_pb2.py", "**/vrp_pb2.pyi"]
# Where first-party imports come from, so they sort into their own block.
src = [
    "client/src",
    "client/tests",
    "orchestrator/src",
    "orchestrator/tests",
    "preprocessor/src",
    "preprocessor/tests",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Trailing commas are the formatter's job; the rule conflicts.
    "CPY001",  # The project does not use per-file copyright headers.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"**/hatch_build.py" = ["INP001"]  # A build hook, not part of a package.
"deploy/admin.py" = ["INP001"]  # A script run in the image.
"**/tests/**" = [
    "S101",     # pytest is built on assert.
    "PLR2004",  # Tests compare against literal expected values.
    "INP001",   # Test directories are not packages.
    "D100",     # Test modules and functions are named for what they check,
    "D103",     # so they need no docstrings.
]

# ---- mypy: static type checking ----------------------------------------------

[tool.mypy]
python_version = "3.13"
files = [
    "client/src",
    "client/tests",
    "deploy/admin.py",
    "orchestrator/src",
    "orchestrator/tests",
    "preprocessor/src",
    "preprocessor/tests",
]
# Generated; mypy still reads the stub to check its users.
exclude = ['vrp_pb2.pyi?$']
strict = true
warn_unreachable = true
# Keep untyped values out: Python's equivalent of compiler errors.
# (disallow_any_decorated is off: every pytest and Hypothesis decorator
# returns a loosely typed function.)
disallow_any_unimported = true
disallow_any_explicit = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

# Generated by protoc: its types are used, but its body is not ours to fix.
[[tool.mypy.overrides]]
module = ["vrp_client.vrp_pb2", "vrp_orchestrator.vrp_pb2"]
ignore_errors = true

# pyrosm has no type information; osm.py turns what it returns into arrays.
[[tool.mypy.overrides]]
module = ["pyrosm", "pyrosm.*"]
ignore_missing_imports = true

# ---- pytest and coverage -----------------------------------------------------

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["client/tests", "orchestrator/tests", "preprocessor/tests"]
# The tests that need a database or an S3 store run only when asked for,
# with `-m postgres` or `-m s3`.
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--import-mode=importlib",
    "-m",
    "not postgres and not s3",
]
markers = [
    "postgres: needs an empty PostgreSQL database at VRP_TEST_DATABASE_URL",
    "s3: needs an S3 store at VRP_TEST_S3_URL, with keys test/testtest",
]
# Any warning, such as an unclosed file, fails the test run.
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["vrp_client", "vrp_orchestrator", "vrp_preprocessor"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
]
