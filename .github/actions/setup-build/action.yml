name: Set up C++ build
description: >
  Restores the FetchContent download cache (GoogleTest), keyed by the runner
  image, an optional variant and the CMake files that pin dependencies.

inputs:
  cache-variant:
    description: >
      Keeps this job's cache apart from other jobs on the same runner image,
      for a job whose preset downloads to a different directory.
    default: ''

runs:
  using: composite
  steps:
    - name: Read runner image version
      id: image
      shell: bash
      run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Cache FetchContent dependencies
      uses: actions/cache@v6
      with:
        path: _deps
        key: ${{ runner.os }}-${{ steps.image.outputs.version }}${{ inputs.cache-variant && format('-{0}', inputs.cache-variant) || '' }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
