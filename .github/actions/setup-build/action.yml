name: Set up C++ build
description: >
  Restores the FetchContent download cache (GoogleTest), keyed by the runner
  image (or the job's container image) and the CMake files that pin
  dependencies.

inputs:
  container-image:
    description: The job's container image, if it runs in one.
    default: ''

runs:
  using: composite
  steps:
    - name: Read runner image version
      id: image
      shell: bash
      env:
        CONTAINER_IMAGE: ${{ inputs.container-image }}
      run: echo "version=${CONTAINER_IMAGE:-${ImageVersion:-unknown}}" >> "$GITHUB_OUTPUT"

    - name: Cache FetchContent dependencies
      uses: actions/cache@v6
      with:
        path: _deps
        key: ${{ runner.os }}-${{ steps.image.outputs.version }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
