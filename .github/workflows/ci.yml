name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.preset == 'release' && 'Release' || 'Debug' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        preset: [ default, release ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  cuda:
    name: CUDA build (ubuntu-24.04)
    # Pinned to match the ubuntu2404 NVIDIA repository below.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install CUDA toolkit
        uses: ./.github/actions/install-cuda

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          cache-variant: cuda-12.9

      - name: Configure
        run: cmake --preset cuda

      - name: Build
        run: cmake --build --preset cuda

      - name: Test
        run: ctest --preset cuda --label-exclude gpu

  worker:
    name: Worker (ubuntu-24.04)
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-archives
    steps:
      - uses: actions/checkout@v7

      - name: Install CUDA toolkit
        uses: ./.github/actions/install-cuda

      - name: Install clang-tidy
        uses: ./.github/actions/install-llvm-tools
        with:
          packages: clang-tidy-22

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          cache-variant: cuda-12.9

      # vcpkg rebuilds its packages when the compiler or CMake changes, so the
      # key must change with them, or the rebuilt packages would never be saved.
      - name: Read compiler and CMake versions
        id: vcpkg-tools
        run: |
          echo "hash=$( (g++ --version; cmake --version) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # gRPC takes most of an hour to build, so its packages are cached.
      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: .vcpkg-archives
          key: vcpkg-ubuntu-24.04-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg-tools.outputs.hash }}

      - name: Set up vcpkg at the pinned baseline
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$(jq -r '."builtin-baseline"' vcpkg.json)"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset worker

      # Saved here, so that a later failure does not cost the next run a
      # rebuild of gRPC.
      - name: Save vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .vcpkg-archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset worker

      - name: Test
        run: ctest --preset worker --label-exclude gpu

      - name: Run clang-tidy
        run: >
          find worker -type f -name "*.cpp"
          | xargs -r -P "$(nproc)" -n 1 clang-tidy-22 -p build/worker --quiet

      # The CPU worker (ADR 0037), from the same vcpkg packages.
      - name: Configure the CPU worker
        run: cmake --preset worker-cpu

      - name: Build the CPU worker
        run: cmake --build --preset worker-cpu

      - name: Test the CPU worker
        run: ctest --preset worker-cpu

      # For the Compose job, which runs a job on it.
      - name: Keep the CPU worker
        uses: actions/upload-artifact@v7
        with:
          name: vrp-worker-cpu
          path: build/worker-cpu/worker/vrp-worker
          retention-days: 1

      - name: Run clang-tidy on the CPU worker
        run: >
          find worker -type f -name "*.cpp"
          | xargs -r -P "$(nproc)" -n 1 clang-tidy-22 -p build/worker-cpu --quiet

  sanitizers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: asan
            name: AddressSanitizer + UndefinedBehaviorSanitizer
          - preset: tsan
            name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Sanitizer runtimes fail on the high-entropy address-space
      # randomisation of recent runner kernels.
      - name: Lower ASLR entropy
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  valgrind:
    name: Valgrind memcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default

      # Catches reads of uninitialised memory, which ASan does not.
      - name: Test under memcheck
        run: >
          valgrind --error-exitcode=1 --leak-check=full
          --errors-for-leak-kinds=definite,indirect --track-origins=yes
          build/default/core/tests/vrp_core_tests --gtest_brief=1

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-tidy
        uses: ./.github/actions/install-llvm-tools
        with:
          packages: clang-tidy-22

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Configure
        run: cmake --preset default

      # The default preset builds without CUDA, so the GPU code and vrp-bench
      # have no compile commands here.
      - name: Run clang-tidy
        run: >
          find core bench -type f -name "*.cpp" -not -path "*/gpu/*"
          -not -path "bench/src/main.cpp"
          | xargs -r -P "$(nproc)" -n 1 clang-tidy-22 -p build/default --quiet

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        uses: ./.github/actions/install-llvm-tools
        with:
          packages: clang-format-22

      - name: Check formatting
        run: >
          git ls-files '*.cpp' '*.hpp' '*.h' '*.cu' '*.cuh'
          | xargs -r clang-format-22 --dry-run --Werror

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Configure
        run: cmake --preset coverage

      - name: Build
        run: cmake --build --preset coverage

      - name: Test
        run: ctest --preset coverage

      - name: Generate coverage report
        run: |
          lcov --capture --directory build/coverage --output-file coverage.info --ignore-errors mismatch,inconsistent
          # Keep only our own sources: drop system headers, tests and GoogleTest.
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/_deps/*' --output-file coverage.info --ignore-errors mismatch,unused
          lcov --summary coverage.info
          genhtml coverage.info --output-directory coverage-html

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-html/

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python: [ '3.13', '3.14' ]
    runs-on: ${{ matrix.os }}
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: '0.13.7'
          python-version: ${{ matrix.python }}
          enable-cache: true

      # --locked fails if uv.lock is out of date with the pyproject files.
      - name: Install
        run: uv sync --locked --all-packages

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Lint
        run: uv run --locked ruff check

      - name: Type-check
        run: uv run --locked mypy

      # Development mode and warn_default_encoding turn unclosed files and
      # platform-dependent text encodings into warnings, which fail the tests.
      - name: Test
        run: >
          uv run --locked python -X dev -X warn_default_encoding
          -m pytest --cov --cov-report=term-missing

  # The tests that need PostgreSQL or an S3 store; Windows runners cannot
  # run containers, so they run on Linux only.
  python-services:
    name: Python with PostgreSQL and S3
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vrp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s
          --health-retries 15
    env:
      VRP_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/vrp_test
      VRP_TEST_S3_URL: http://127.0.0.1:8333
    steps:
      - uses: actions/checkout@v7

      # A service container cannot be given a command, and SeaweedFS needs
      # one (ADR 0029).
      - name: Start SeaweedFS
        run: |
          mkdir -p "$RUNNER_TEMP/s3"
          cat > "$RUNNER_TEMP/s3/s3.json" <<'EOF'
          {"identities": [{"name": "test", "credentials": [{"accessKey": "test", "secretKey": "testtest"}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
          EOF
          docker run -d -p 8333:8333 -v "$RUNNER_TEMP/s3:/etc/seaweedfs" \
            chrislusf/seaweedfs:4.54 server -s3 -s3.config=/etc/seaweedfs/s3.json
          for _ in $(seq 60); do
            curl -s -o /dev/null http://127.0.0.1:8333/ && exit 0
            sleep 1
          done
          exit 1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: '0.13.7'
          python-version: '3.14'
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-packages

      - name: Test
        run: >
          uv run --locked python -X dev -X warn_default_encoding
          -m pytest -m "postgres or s3"

  compose:
    name: Docker Compose stack
    runs-on: ubuntu-24.04  # the CPU worker's build
    needs: worker
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack from scratch
        run: docker compose -f deploy/compose.yaml up --build --wait --wait-timeout 300

      - name: Check that a backup restores
        run: |
          docker compose -f deploy/compose.yaml exec -T backup sh /backup.sh now
          docker compose -f deploy/compose.yaml exec -T backup sh /backup.sh verify

      # ADR 0003: the exporter's role sees statistics, not job tables.
      - name: Check that the monitoring role reads statistics but not jobs
        run: |
          psql() { docker compose -f deploy/compose.yaml exec -T postgres psql -U vrp_monitor -d vrp "$@"; }
          psql -Atc 'SELECT count(*) FROM pg_stat_activity'
          denied=$(psql -c 'SELECT 1 FROM jobs' 2>&1 || true)
          grep -q 'permission denied for table jobs' <<<"$denied"

      - name: Download the CPU worker
        uses: actions/download-artifact@v7
        with:
          name: vrp-worker-cpu
          path: ${{ runner.temp }}/worker

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: '0.13.7'
          python-version: '3.14'
          enable-cache: true

      # Every part at once: TLS, tokens, the store's URLs, the worker's
      # session and the orchestrator as it is deployed (ADR 0031, 0037).
      - name: Run a job end to end on the CPU worker
        run: |
          compose() { docker compose -f deploy/compose.yaml "$@"; }
          preprocess() { uv run --locked --package vrp-preprocessor vrp-preprocessor "$@"; }
          dir="$RUNNER_TEMP/worker"
          # Presigned URLs name the store by VRP_HOST's default.
          echo "127.0.0.1 vrp.localhost" | sudo tee -a /etc/hosts
          preprocess synthetic grid --width 60 --height 60 --output "$RUNNER_TEMP/grid"
          preprocess problem --graph "$RUNNER_TEMP/grid" --customers 30 --output "$RUNNER_TEMP/problem.json"
          compose run --rm -v "$RUNNER_TEMP/grid:/graph:ro" admin register-graph /graph
          compose run --rm -T admin worker ci --metrics-address localhost:9101 > "$dir/worker.json"
          compose run --rm -T admin ca > "$dir/ca.pem"
          chmod +x "$dir/vrp-worker"
          "$dir/vrp-worker" --config "$dir/worker.json" &
          # Token names are unique across roles. Assigned on its own, so that
          # a refusal ends the step here.
          token=$(compose run --rm -T admin client ci-client)
          VRP_TOKEN="$token" VRP_ORCHESTRATOR=localhost:50051 VRP_CA_CERTIFICATE="$dir/ca.pem" \
            uv run --locked --package vrp-client python bench/jobs.py \
            --graph-version "$(jq -r .graph_version "$RUNNER_TEMP/grid/manifest.json")" \
            --problem "$RUNNER_TEMP/problem.json" --seconds 5 --out "$RUNNER_TEMP/jobs.jsonl"

      - name: Show the logs
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml logs --no-color
          cat "$RUNNER_TEMP/worker/logs/worker.log" || true

  docs:
    name: Links and spelling
    runs-on: ubuntu-latest
    env:
      LYCHEE: lycheeverse/lychee@sha256:eaff3e0a13603c9a701accfcc84f44158bb77bf36ecfa4622b626056c3463892  # 0.24.2
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: '0.13.7'
          python-version: '3.14'
          enable-cache: true

      - name: Check spelling
        run: git ls-files -z | xargs -0 uv run --locked --only-group docs codespell

      # Every link inside the repository, images and anchors included; the
      # weekly `links` workflow checks the outside ones.
      - name: Check links in the repository
        run: >
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$LYCHEE"
          --offline --include-fragments --root-dir /repo --no-progress
          '**/*.md'

      - name: Check that the architecture views match the model
        run: |
          uv run --no-project docs/architecture/export.py
          git diff --exit-code -- README.md deploy/README.md docs/architecture/README.md

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: '0.13.7'
          python-version: '3.14'
          enable-cache: true

      # Checks every locked dependency, with hashes, for known
      # vulnerabilities. uv environments have no pip, hence --disable-pip.
      - name: Audit locked dependencies
        run: |
          uv export --locked --all-packages --all-groups --no-emit-workspace \
            --format requirements-txt --output-file requirements-audit.txt
          uv run --locked pip-audit --requirement requirements-audit.txt \
            --disable-pip --require-hashes --progress-spinner off
